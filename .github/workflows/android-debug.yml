name: Android debug build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'index.html'
      - 'delete-account.html'
      - 'privacy.html'
      - 'sw.js'
      - 'package-lock.json'
      - 'package.json'
      - 'capacitor.config.json'
      - 'vite.config.js'
      - 'scripts/**'
      - '.github/workflows/android-debug.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - 'vite.config.js'
      - 'scripts/**'
      - '.github/workflows/android-debug.yml'

concurrency:
  group: iq-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android 16 SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Commit generated npm lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${GITHUB_HEAD_REF}"
          git rebase "origin/${GITHUB_HEAD_REF}"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already current"
          else
            git commit -m "chore: lock mobile build dependencies"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Build web assets
        run: |
          npm run build
          test -s www/index.html
          test -s www/privacy.html
          test -s www/delete-account.html

      - name: Generate Android project
        run: npx cap add android

      - name: Generate Android app icons and splash screen
        run: npx capacitor-assets generate --android --iconBackgroundColor '#173b9e' --splashBackgroundColor '#173b9e'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Verify account deletion rejects unauthenticated requests
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch('https://dkaoptjafnilyztlznmk.supabase.co/functions/v1/delete-account', {
            method: 'POST',
            headers: {
              apikey: 'sb_publishable_wzAJmA21MoRZhkokNj2RFw_lLqi8U9C',
              'Content-Type': 'application/json'
            },
            body: '{}'
          });
          if (response.status !== 401) {
            const body = await response.text();
            throw new Error(`Expected unauthenticated deletion request to return 401, got ${response.status}: ${body}`);
          }
          console.log('Account deletion endpoint correctly rejects unauthenticated requests.');
          NODE

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: iq-challenge-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
